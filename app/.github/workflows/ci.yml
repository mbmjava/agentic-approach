name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build, test, static analysis
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend-test:
    name: Frontend Test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, typecheck, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  docs-check:
    name: Docs Check (links + frontmatter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Docs and links
        run: node scripts/check-docs.mjs

      - name: Staleness / orphan report (non-blocking)
        continue-on-error: true
        run: node scripts/docs-report.mjs

      - name: Harness parity (agents + skills)
        run: node scripts/check-harness-parity.mjs

      - name: Worker permission guard tests
        run: node --test scripts/worker-shell-guard.test.mjs scripts/known-issues-schema.test.mjs scripts/lib/subagent-policy.test.mjs scripts/watch-opencode-session.test.mjs

      - name: Agent model source check
        run: node scripts/sync-agent-models.mjs --check

  agentic-loop:
    name: Agentic Loop (policy + calibration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Policy, decision, forge, and calibration tests
        run: node --test scripts/agentic/*.test.mjs scripts/agentic/forge/*.test.mjs
