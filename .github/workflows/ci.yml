name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------
  # PLAYBOOK (guide) LINKS
  # ----------------------------------------------------
  guide-check:
    name: Guide Check (links)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guide and root links
        run: node scripts/check-guide-links.mjs

  # ----------------------------------------------------
  # STARTER: BACKEND
  # ----------------------------------------------------
  app-backend:
    name: App Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build, test, static analysis
        working-directory: app
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  # ----------------------------------------------------
  # STARTER: FRONTEND
  # ----------------------------------------------------
  app-frontend:
    name: App Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Lint, typecheck, test, build
        working-directory: app/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  # ----------------------------------------------------
  # STARTER: DOCS + HARNESS
  # ----------------------------------------------------
  app-harness:
    name: App Harness Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Docs and links
        working-directory: app
        run: node scripts/check-docs.mjs
      - name: Staleness / orphan report (non-blocking)
        working-directory: app
        continue-on-error: true
        run: node scripts/docs-report.mjs
      - name: Harness parity (agents + skills)
        working-directory: app
        run: node scripts/check-harness-parity.mjs
      - name: Agent model source check
        working-directory: app
        run: node scripts/sync-agent-models.mjs --check
